name: anime_pulse
description: Dashboard y catálogo de anime (Flutter Web + Móvil) que consume la API FastAPI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3      # estado + inyección de dependencias
  dio: ^5.7.0                   # cliente HTTP con interceptores
  fl_chart: ^1.2.0             # gráficos (pin <0.70: la API de títulos cambió después)
  flutter_secure_storage: ^11.2.0 # tokens (Keychain/Keystore; WebCrypto en web)
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
